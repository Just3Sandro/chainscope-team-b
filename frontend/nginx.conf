# Frontend ChainScope : SPA (fallback index.html) + reverse proxy API vers le backend.
# Le service `backend` est fourni par le docker-compose racine (spec §2, D-01).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API backend (chemin /api/v1/…) — headers standard de proxy inversé.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback : toute route inconnue renvoie index.html (React Router prend en main).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
